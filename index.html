<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yaldah Issa</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* ===============================
ROOT COLORS
=============================== */

:root{
--cream:#F6F1E6;
--gold:#D6B25E;
--brown:#4B2E21;
--brown-soft:#5B4230;
--shadow:0 20px 40px rgba(0,0,0,.2);
}

/* ===============================
RESET
=============================== */

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
background:var(--cream);
color:var(--brown-soft);
overflow-x:hidden;
}

/* ===============================
HEADER
=============================== */

.site-header{

position:sticky;
top:0;

display:grid;
grid-template-columns:50px 1fr auto;

align-items:center;

padding:16px 24px;

background:var(--brown);

border-bottom:1px solid rgba(214,178,94,.2);

z-index:100;

}

/* MENU BUTTON */

.menu-btn{

width:42px;
height:42px;

border-radius:50%;

border:1px solid rgba(214,178,94,.2);

background:transparent;

display:flex;
flex-direction:column;
justify-content:center;

gap:6px;

padding:0 12px;

cursor:pointer;

}

.menu-btn span{
height:2px;
width:100%;
background:#F2E1AE;
}

/* BRAND */

.brandmark{
display:flex;
align-items:center;
justify-self:center;
gap:12px;
}

.brand-logo{
width:32px;
height:32px;
border-radius:50%;
}

.brand-name{

font-family:'Cormorant Garamond',serif;

letter-spacing:.35em;

font-size:18px;

text-transform:uppercase;

background:linear-gradient(#fff,#D6B25E);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

/* HEADER ICONS */

.header-icons{
display:flex;
align-items:center;
gap:12px;
}

.icon-btn{

width:42px;
height:42px;

border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

border:1px solid rgba(214,178,94,.25);

background:transparent;

color:#F2E1AE;

cursor:pointer;

}

.icon-btn svg{

width:20px;
height:20px;

stroke:currentColor;
stroke-width:1.5;

fill:none;

}

.icon-btn:hover{
background:rgba(255,255,255,.05);
}

/* ===============================
NAVIGATION
=============================== */

.topnav{

grid-column:1/-1;

display:flex;

justify-content:center;

gap:30px;

padding-top:14px;

border-top:1px solid rgba(214,178,94,.15);

}

.navpill{

font-size:11px;

letter-spacing:.22em;

text-transform:uppercase;

color:#F2E1AE;

position:relative;

}

.navpill::after{

content:"";

position:absolute;

bottom:-8px;
left:0;

width:0;

height:1px;

background:#D6B25E;

transition:.3s;

}

.navpill:hover::after{
width:100%;
}

/* ===============================
HERO
=============================== */

.hero{

height:90vh;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

background:url("https://images.unsplash.com/photo-1520975922324-7b0c5d0c58e4?auto=format&fit=crop&w=1600&q=80");

background-size:cover;
background-position:center;

position:relative;

}

.hero::after{

content:"";

position:absolute;

inset:0;

background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.2));

}

.hero-content{

position:relative;
z-index:2;

color:white;

}

.hero-title{

font-family:'Cormorant Garamond',serif;

font-size:70px;

letter-spacing:.04em;

margin-bottom:20px;

}

.hero-btn{

display:inline-block;

padding:14px 28px;

border-radius:50px;

background:linear-gradient(#fff3c9,#D6B25E);

color:#2B1A12;

text-transform:uppercase;

letter-spacing:.2em;

font-size:12px;

}

.hero-btn:hover{
transform:translateY(-2px);
}

/* ===============================
MOBILE
=============================== */

@media(max-width:900px){

.topnav{
display:none;
}

.brand-name{
font-size:14px;
letter-spacing:.2em;
}

.hero-title{
font-size:42px;
}

}

</style>
</head>

<body>

<header class="site-header">

<button class="menu-btn">
<span></span>
<span></span>
<span></span>
</button>

<a class="brandmark" href="#">
<img src="https://i.imgur.com/YOURLOGO.png" class="brand-logo">
<span class="brand-name">YALDAH ISSA</span>
</a>

<div class="header-icons">

<a class="icon-btn" href="#">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="8" r="3.5"></circle>
<path d="M5.5 19.5c1.8-3 4.2-4.5 6.5-4.5s4.7 1.5 6.5 4.5"></path>
</svg>
</a>

<a class="icon-btn" href="#">
<svg viewBox="0 0 24 24">
<path d="M6.5 8h11l-1 11H7.5l-1-11z"></path>
<path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path>
</svg>
</a>

</div>

<nav class="topnav">

<a class="navpill" href="#">Home</a>
<a class="navpill" href="#">Shop</a>
<a class="navpill" href="#">Suits</a>
<a class="navpill" href="#">Dresses</a>
<a class="navpill" href="#">About</a>
<a class="navpill" href="#">Contact</a>

</nav>

</header>

<section class="hero">

<div class="hero-content">

<h1 class="hero-title">Excellence With Purpose</h1>

<a class="hero-btn" href="#">Enter Collection</a>

</div>

</section>

</body>
</html>
